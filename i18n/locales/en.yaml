# ---------------------------------------------------------------------------
# Front page.
# ---------------------------------------------------------------------------
home:
  title: Front page
  welcome: Welcome to Hibiscusvej 2-30
  governedBy: This site is run by the residence's volunteer board.
  # Split around the board mailto link: contactIntro + link + "."
  contactIntro: If you have questions, you are always welcome to contact
  boardLink: the board
  # Split around the Facebook link: facebookIntro + link + facebookOutro
  facebookIntro: The residence also has a
  facebookLink: Facebook group
  facebookOutro: ', where useful information is shared regularly.'

# ---------------------------------------------------------------------------
# Web-push notifications, rendered SERVER-side per recipient language
# (see the header note in da.yaml). Admin voice and user voice are different
# audiences - the two namespaces never share a string.
# ---------------------------------------------------------------------------
push:
  admin:
    # A user registered themselves (sent from auth/register), and reused as
    # the title when an admin verifies a user that registered recently.
    newUser: New user!
    newUserCreatedBody: '#{userId} has been created and is awaiting verification.'
    userVerified: User verified!
    verifiedBodyRecent: '{admin} verified #{userId}, created {duration} ago.'
    verifiedBody: '{admin} verified #{userId}.'

    bookingRequestCreated: New booking request!
    bookingRequestCreatedBody: '#{userId} has made a new request that needs to be handled.'
    bookingRequestDeleted: Booking request deleted
    bookingRequestDeletedBody: '#{userId} has deleted their booking request #{requestId}.'
    bookingRequestHandled: Booking request handled
    bookingRequestHandledBody: 'The request from #{userId} has been handled.'
    bookingRequestClosed: Booking request closed automatically
    bookingRequestClosedBody: '#{userId} had a request closed automatically because a booking was created by {bookedByUserId}.'

  user:
    accountVerified: Account verified!
    accountVerifiedBody: The board has verified your account, and you can now book the communal room!
    bookingRequestHandled: Booking request handled
    bookingRequestHandledBody: Your booking request has been handled, go to your requests to see the assessment.
    bookingRequestClosed: Booking request closed automatically
    bookingRequestClosedBody: Your booking request was closed automatically because another user created a booking.

# Server error keys - the stable API contract lives in
# `server/utils/i18n-errors.ts` (ERROR_KEYS).
errors:
  booking:
    notVerified: Your user is not verified.
    bannedUntil: Your user is temporarily blocked from creating bookings until {date}.
    banned: Your user is blocked from creating bookings.
    startAfterEnd: The start time must be earlier than the end time.
    startInPast: The booking cannot start in the past.
    slotTaken: There is already a booking in that time slot
    ownRequestOverlap: You already have a request in that time slot
    maxConsecutiveReached: You can have at most {count} consecutive bookings.
    noConsecutiveAllowed: You cannot have consecutive bookings.
    maxWeeklyReached: You can have at most {count} bookings every 7 days.
    maxMonthlyReached: You can have at most {count} bookings every 31 days.
