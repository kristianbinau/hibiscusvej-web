# ---------------------------------------------------------------------------
# Resident-facing text catalog - Danish (default locale)
#
# The Danish file is the source of truth; English translations are written in
# en.yaml alongside. Board members edit text; the webmaster pastes it in.
#
# NOTE: YAML forbids tab indentation - this file uses spaces.
#
# Namespaces:
#   common         - shared UI words (buttons, labels)
#   nav            - navigation items
#   auth           - login / register / reset
#   booking        - booking calendar and booking flow
#   bookingRequest - booking request modal and lists
#   parking        - parking
#   settings       - settings page (incl. the "Sprog" section)
#   home           - front page (index.vue)
#   push.user      - web-push notifications rendered for the recipient
#   push.admin     - web-push notifications rendered for admins
#   errors         - client-side rendering of server error keys
#                    (server error responses carry `key` + `params`; the
#                    Danish `message` on the wire is the fallback)
#   langHint       - browser-language hint toast. NOTE: the text is chosen by
#                    the visitor's BROWSER language, not the site locale, so
#                    both variants are kept identical in da.yaml and en.yaml.
#   meta           - site metadata (page description etc.)
#
# Interpolation uses vue-i18n named params: {date}, {count}, ...
# Dates arrive as ISO strings and are locale-formatted by the client before
# interpolation - never hardcode a date format in the message text.
# ---------------------------------------------------------------------------
meta:
  description: Informationer omkring studieboligerne ved Hibiscusvej

langHint:
  # Selected by the visitor's browser language (see header note).
  message:
    en: The website is also available in English.
    da: Websiden findes også på engelsk.
  accept:
    en: Switch to English
    da: Skift til engelsk
  dismiss:
    en: Don't show again
    da: Vis ikke igen

